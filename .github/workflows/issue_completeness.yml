name: Close incomplete issues

# Closes new issues that are missing an IPA link or a description of the bug,
# and reopens them when an edit adds what was missing. A missing log is only
# pointed out in a comment. The check itself lives in
# .github/scripts/issue-completeness.js.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: issue-completeness-${{ github.event.issue.number }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@main
        with:
          script: |
            const { run } = require('./.github/scripts/issue-completeness.js');
            await run({ github, context, core });
