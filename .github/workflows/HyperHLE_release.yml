name: Build AppleJuiceHLE

on:
  workflow_dispatch:
    inputs:
      publish_hyperhle_release:
        description: Publish a AppleJuiceHLE release (after all builds succeed)
        type: boolean
        default: false
      ci_timings:
        description: Upload cargo --timings reports (CI performance work)
        type: boolean
        default: false
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue instead of replacing pending runs. Non-trunk runs also queue rather
  # than cancel stale CI runs; GitHub retains at most 100 pending per group.
  queue: max

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      # GCC 15 defaults to C23; bundled SDL2 uses bool/true/false as identifiers.
      # https://gcc.gnu.org/gcc-15/porting_to.html#c23
      CFLAGS: -std=gnu17

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux build dependencies
        # SDL2 and openal-soft are built from source (the `static` feature uses
        # the `bundled` SDL2 build), so the development headers for the audio,
        # video and input backends they detect must be available.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22
        with:
          cmakeVersion: "~3.29.0"

      - name: Build
        run: cargo build --release

      - name: Create bundle
        run: cd dev-scripts && ./make-linux-bundle.sh ../target/release/touchHLE && mv touchHLE_linux_bundle/ ..

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AppleJuiceHLE_Linux_x86_64
          path: touchHLE_linux_bundle/

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout touchHLE
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Cache Rust build artifacts
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Try to get cached copy of Boost
      id: cache-boost
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: vendor/boost
        key: boost_1_81_0

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Download Boost
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Extract Boost
      run: 7z -ovendor x boost_1_81_0.7z && mv vendor/boost_1_81_0 vendor/boost

    - name: Try to get cached copy of cmake
      id: cache-cmake
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: vendor/cmake
        key: cmake_3_31_6_linux

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Download Cmake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Extract Cmake
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake

    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4

    - name: Try to get a cached copy of Gradle
      id: cache-gradle
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: gradle
        key: gradle-8.11.1

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}
      name: Download Gradle
      run: curl -L -o gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}
      name: Extract Gradle
      run: 7z -ogradle x gradle-8.11.1-bin.zip

    - name: Try to get a cached copy of Android NDK
      id: cache-android-ndk
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: android-ndk
        key: android-ndk-r25c-unzip-v2

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}
      name: Download Android NDK
      run: curl -L -o android-ndk-r25c-linux.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}
      name: Extract Android NDK
      # NDK compiler/debugger aliases include chained Unix symlinks. Info-ZIP
      # preserves them; 7-Zip rejects the chain with exit code 2.
      run: unzip -q android-ndk-r25c-linux.zip -d android-ndk

    - name: Validate NDK compiler and debugger symlinks
      run: |
        NDK_PREBUILT="$PWD/android-ndk/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64"
        test -x "$NDK_PREBUILT/bin/clang"
        test -x "$NDK_PREBUILT/bin/clang++"
        test -x "$NDK_PREBUILT/bin/ld"
        test -x "$NDK_PREBUILT/bin/ld.lld"
        test -e "$NDK_PREBUILT/lib64/liblldb.so"

    - name: Link Android NDK
      run: ln -s $PWD'/android-ndk/android-ndk-r25c' $ANDROID_SDK_ROOT'/ndk/25.2.9519653'

    - name: Generate local.properties file
      run: echo 'sdk.dir='$ANDROID_SDK_ROOT > android/local.properties

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'

    - name: Build for Android
      run: cd android && ../gradle/gradle-8.11.1/bin/gradle assembleRelease && mv app/build/outputs/apk/release/AppleJuiceHLE-release.apk ../AppleJuiceHLE.apk
      env:
        ANDROID_NDK_ROOT: '/usr/local/lib/android/sdk/ndk/25.2.9519653'
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

    - name: Apply APK v3 key-rotation lineage (if configured)
      env:
        HYPERHLE_KEY_LINEAGE_B64: ${{ secrets.HYPERHLE_KEY_LINEAGE_B64 }}
        HYPERHLE_KEYSTORE_B64: ${{ secrets.HYPERHLE_KEYSTORE_B64 }}
        HYPERHLE_KEYSTORE_PASSWORD: ${{ secrets.HYPERHLE_KEYSTORE_PASSWORD }}
        HYPERHLE_KEY_ALIAS: ${{ secrets.HYPERHLE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        if [ -z "${HYPERHLE_KEY_LINEAGE_B64:-}" ] || [ -z "${HYPERHLE_KEYSTORE_B64:-}" ]; then
          exit 0
        fi
        APKSIGNER="$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)"
        KS_TMP="$(mktemp --suffix=.keystore)"
        LIN_TMP="$(mktemp --suffix=.lineage)"
        trap 'rm -f "$KS_TMP" "$LIN_TMP"' EXIT
        printf '%s' "$HYPERHLE_KEYSTORE_B64" | base64 -d > "$KS_TMP"
        printf '%s' "$HYPERHLE_KEY_LINEAGE_B64" | base64 -d > "$LIN_TMP"
        "$APKSIGNER" sign \
          --ks "$KS_TMP" \
          --ks-key-alias "${HYPERHLE_KEY_ALIAS:-hyperhle}" \
          --ks-pass env:HYPERHLE_KEYSTORE_PASSWORD \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --lineage "$LIN_TMP" \
          AppleJuiceHLE.apk

    - uses: actions/upload-artifact@main
      with:
        name: AppleJuiceHLE_Android_AArch64
        path: AppleJuiceHLE.apk

  test-app:
    runs-on: macos-latest
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: recursive
          # Full history and tags: the app version comes from the latest
          # release tag and the build number from the commit count.
          fetch-depth: 0
          fetch-tags: true

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: vendor/boost
          key: boost_1_81_0_macos

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22
        with:
          cmakeVersion: "~3.29.0"

      - name: Install x86_64 toolchain
        run: rustup target add x86_64-apple-darwin

      # TestApp is built with LLVM 12 against the common-3.0 SDK, as in
      # touchHLE's CI. These steps were removed in 49d9d48e.
      - name: Try to get cached copy of LLVM
        id: cache-llvm
        uses: actions/cache@main
        with:
          path: tests/llvm
          key: llvm_12_0_0_macOS_x64

      - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Download LLVM
        run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz"

      - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Extract LLVM
        run: tar -xf clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz && mkdir tests/llvm && mv clang+llvm-12.0.0-x86_64-apple-darwin/* tests/llvm

      - name: Get copy of common-3.0-sdk
        run: cd tests && curl -L https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-macOS-universal.tar.gz | tar xzv

      - name: Test
        run: cargo test --target x86_64-apple-darwin

  build-win:
    # This waits for check-hyperhle-release only to learn the
    # version a release build will be tagged with (for the installer), and
    # runs regardless.
    needs: [check-hyperhle-release]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    env:
      HYPERHLE_VERSION: ${{ needs.check-hyperhle-release.outputs.should_release == 'true' && needs.check-hyperhle-release.outputs.version || '' }}
      # See the comment in build-osx: `cmake --build` without `--parallel`
      # compiles SDL2/OpenAL Soft/libxml2/Dynarmic one file at a time. The
      # `cmake` crate selects the Visual Studio generator here, and `--build`
      # forwards this value to MSBuild as `/m`.
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
    - name: Checkout touchHLE
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        submodules: recursive

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        save-if: ${{ github.ref == 'refs/heads/trunk' }}

    - name: Try to get cached copy of Boost
      id: cache-boost
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: vendor\boost
        key: boost_1_81_0

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Download Boost
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Extract Boost
      run: 7z -ovendor x boost_1_81_0.7z && ren vendor\boost_1_81_0 boost

    - name: Setup CMake
      uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22
      with:
        cmakeVersion: "~3.29.0"

    - name: Build
      run: cargo build --release

    - name: Create bundle
      shell: bash
      run: cd dev-scripts && ./make-windows-bundle.sh ../target/release/touchHLE.exe && mv touchHLE_windows_bundle/ ..

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: AppleJuiceHLE_Windows_x86_64
        path: touchHLE_windows_bundle/

    - name: Build installer
      # Inno Setup 6 ships with the windows-2022 runner image; install it only
      # if the image ever stops including it. PowerShell rather than bash, as
      # MSYS would rewrite ISCC's /D and /O arguments into paths.
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
        if (-not (Test-Path $iscc)) {
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        if ($env:HYPERHLE_VERSION) {
          $version = $env:HYPERHLE_VERSION
        } else {
          $version = (cargo run --quiet --package touchHLE_version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        if ($version -notmatch '(\d+)\.(\d+)\.(\d+)') {
          throw "Can't get a numeric version from '$version'"
        }
        $numeric = $Matches[0]
        & $iscc "/DAppVersion=$version" "/DAppNumericVersion=$numeric" `
          "/DBundleDir=..\touchHLE_windows_bundle" "/DOutputDir=.." `
          dev-scripts\hyperhle-installer.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Uploaded as-is rather than wrapped in a zip.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        path: AppleJuiceHLE_Windows_x86_64_Setup.exe
        archive: false

  check-hyperhle-release:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/trunk' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      changelog_from: ${{ steps.check.outputs.changelog_from }}
      changelog_limit: ${{ steps.check.outputs.changelog_limit }}
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check whether a AppleJuiceHLE release is due
        id: check
        env:
          FORCE_HYPERHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hyperhle_release && 'true' || '' }}
        run: ./dev-scripts/hyperhle-should-release.sh

  publish-hyperhle-release:
    needs: [check-hyperhle-release, build-linux, build-android, build-win, test-app]
    if: >-
      github.ref == 'refs/heads/trunk' &&
      needs.check-hyperhle-release.result == 'success' &&
      needs.check-hyperhle-release.outputs.should_release == 'true' &&
      needs.build-linux.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.sign-android-release.result == 'success' &&
      needs.build-win.result == 'success' &&
      needs.test-app.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Download Android artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: AppleJuiceHLE_Android_AArch64
          path: artifacts/android
      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: AppleJuiceHLE_Windows_x86_64
          path: artifacts/windows
      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: AppleJuiceHLE_Windows_x86_64_Setup.exe
          path: artifacts/windows-installer
      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: AppleJuiceHLE_Linux_x86_64
          path: artifacts/linux
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc zip
      - name: Package AppleJuiceHLE release files
        env:
          # Lets the changelog look up each commit author's GitHub username.
          GH_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          FORCE_HYPERHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hyperhle_release && 'true' || '' }}
          VERSION: ${{ needs.check-hyperhle-release.outputs.version }}
          CHANGELOG_FROM: ${{ needs.check-hyperhle-release.outputs.changelog_from }}
          CHANGELOG_LIMIT: ${{ needs.check-hyperhle-release.outputs.changelog_limit }}
        run: ./dev-scripts/package-hyperhle-release.sh "$VERSION" "$CHANGELOG_FROM"
      - name: Publish AppleJuiceHLE release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.check-hyperhle-release.outputs.version }}
          # Tag the commit that was built, not whatever trunk points at by now.
          target_commitish: ${{ github.sha }}
          name: AppleJuiceHLE ${{ needs.check-hyperhle-release.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/AppleJuiceHLE_*.zip
            release/AppleJuiceHLE_Windows_x86_64_Setup.exe
          fail_on_unmatched_files: true
