// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '2.0.21'
    }
    repositories {
        // Central answers through several front ends; a 404 storm on one of
        // them (as GitHub's runners saw on repo.maven.apache.org) leaves the
        // others serving the same artifacts, so list the alternatives.
        maven {
            url "https://maven-central.storage-download.googleapis.com/maven2/"
        }
        maven {
            url "https://repo1.maven.org/maven2"
        }
        mavenCentral()
        google()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath "gradle.plugin.com.github.willir.rust:plugin:0.3.4"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven {
            url "https://maven-central.storage-download.googleapis.com/maven2/"
        }
        maven {
            url "https://repo1.maven.org/maven2"
        }
        mavenCentral()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
